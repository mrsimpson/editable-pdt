<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><script>window.__WORKSPACE__={"name":"Harvest Commons","documents":[{"file":"1-exploration/e1-arenas.pdt42.md","title":"Identify the ecosystem and its arenas · Choose the arena to focus on","steps":["E1","E4"],"nodes":[{"kind":"heading","level":1,"text":"Identify the ecosystem and its arenas · Choose the arena to focus on","line":1},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-arena-scan","canvas":"arena-scan"},"attributeLines":{"id":5,"canvas":6},"startLine":4,"endLine":7,"fenceStart":3},{"kind":"heading","level":2,"text":"Regional food system","line":10},{"kind":"prose","text":"Around the city, about sixty small farms grow vegetables, fruit and herbs. They sell at weekly\nmarkets, to a regional wholesale market and to a handful of restaurants that call them directly.\nValue is exchanged every day — but through phone calls, market stalls and a wholesaler that\nhides the farms from the kitchens that cook their produce.","startLine":12,"endLine":15},{"kind":"block","blockType":"ecosystem","attributes":{"id":"eco-food","title":"Regional food system","context":"ecosystem-mobilization"},"attributeLines":{"id":19,"title":20,"context":21},"startLine":18,"endLine":22,"fenceStart":17},{"kind":"heading","level":2,"text":"Growing and harvesting","line":25},{"kind":"prose","text":"Planning crops, growing them and bringing them in. Seasonal and weather-bound; today planned\nagainst last year's sales rather than against demand.","startLine":27,"endLine":28},{"kind":"block","blockType":"arena","attributes":{"id":"ar-growing","title":"Growing and harvesting","outcome":"The right crops are ready at the right time","steps":["Plan the crops","Grow","Harvest"]},"attributeLines":{"id":32,"title":33,"outcome":34,"steps":35},"startLine":31,"endLine":39,"fenceStart":30},{"kind":"heading","level":2,"text":"Selling the harvest","line":42},{"kind":"prose","text":"Finding buyers, agreeing quantities and prices, and getting paid. This is where farms lose most\nvalue: up to a fifth of the harvest is never sold. It is our focus — the cooperative already runs\na market stall and knows both farms and customers, and the only incumbent here is the wholesale\nmarket.","startLine":44,"endLine":47},{"kind":"block","blockType":"arena","attributes":{"id":"ar-selling","title":"Selling the harvest","outcome":"Produce reaches a kitchen at a fair price before it spoils","after":"ar-growing","focus":"yes","steps":["Find buyers","Agree quantities and prices","Deliver","Get paid and get feedback"]},"attributeLines":{"id":51,"title":52,"outcome":53,"after":54,"focus":55,"steps":56},"startLine":50,"endLine":61,"fenceStart":49},{"kind":"heading","level":2,"text":"Getting food to kitchens","line":64},{"kind":"prose","text":"Transport from the farm into the city. Every farm drives its own van today; this arena enables\nselling.","startLine":66,"endLine":67},{"kind":"block","blockType":"arena","attributes":{"id":"ar-delivery","title":"Getting food to kitchens","outcome":"Food arrives fresh, on time and without every farm driving into town","enables":"ar-selling"},"attributeLines":{"id":71,"title":72,"outcome":73,"enables":74},"startLine":70,"endLine":75,"fenceStart":69},{"kind":"heading","level":2,"text":"Cooking and eating","line":78},{"kind":"prose","text":"What restaurants and households do with the food. Enabled by selling; out of our reach for now.","startLine":80,"endLine":80},{"kind":"block","blockType":"arena","attributes":{"id":"ar-cooking","title":"Cooking and eating","outcome":"Seasonal meals that tell where the food comes from","after":"ar-selling"},"attributeLines":{"id":84,"title":85,"outcome":86,"after":87},"startLine":83,"endLine":88,"fenceStart":82}]},{"file":"1-exploration/e2-scan.pdt42.md","title":"Scan the ecosystem","steps":["E2"],"nodes":[{"kind":"heading","level":1,"text":"Scan the ecosystem","line":1},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-ecosystem-scan","canvas":"ecosystem-scan"},"attributeLines":{"id":5,"canvas":6},"startLine":4,"endLine":7,"fenceStart":3},{"kind":"heading","level":2,"text":"Find buyers for the week's harvest","line":10},{"kind":"prose","text":"Every Monday farmers call restaurants and the wholesaler to place what they expect to harvest.\nWhatever is left goes to the wholesaler at its price.","startLine":12,"endLine":13},{"kind":"block","blockType":"job","attributes":{"id":"j-find-buyers","title":"Find buyers for the week's harvest","arena":"ar-selling","entities":"e-farmers, e-restaurants, e-wholesaler","job-step":"locate"},"attributeLines":{"id":17,"title":18,"arena":19,"entities":20,"job-step":21},"startLine":16,"endLine":22,"fenceStart":15},{"kind":"heading","level":2,"text":"Sell at the Saturday market","line":25},{"kind":"prose","text":"Farmers and households meet in person. Households love it but cannot plan around it.","startLine":27,"endLine":27},{"kind":"block","blockType":"job","attributes":{"id":"j-market","title":"Sell at the Saturday market","arena":"ar-selling","entities":"e-farmers, e-households","job-step":"execute"},"attributeLines":{"id":31,"title":32,"arena":33,"entities":34,"job-step":35},"startLine":30,"endLine":36,"fenceStart":29},{"kind":"heading","level":2,"text":"Drive produce into town","line":39},{"kind":"prose","text":"Each farm loads its own van for a handful of deliveries.","startLine":41,"endLine":41},{"kind":"block","blockType":"job","attributes":{"id":"j-drive","title":"Drive produce into town","arena":"ar-delivery","entities":"e-farmers, e-restaurants","job-step":"execute"},"attributeLines":{"id":45,"title":46,"arena":47,"entities":48,"job-step":49},"startLine":44,"endLine":50,"fenceStart":43}]},{"file":"1-exploration/e3-assets-moats.pdt42.md","title":"Identify leverageable assets and moats","steps":["E3"],"nodes":[{"kind":"heading","level":1,"text":"Identify leverageable assets and moats","line":1},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-vrio","canvas":"vrio"},"attributeLines":{"id":5,"canvas":6},"startLine":4,"endLine":7,"fenceStart":3},{"kind":"heading","level":2,"text":"Saturday market customer base","line":10},{"kind":"prose","text":"Eight years of market days have built a list of 2,000 households who ask for the farms by name.\nValuable, rare, hard to copy — and the cooperative is organised to use it.","startLine":12,"endLine":13},{"kind":"block","blockType":"asset","attributes":{"id":"as-customers","title":"Saturday market customer base","vrio":"vrio","layer":"long-tail","relates-to":"e-households, j-market"},"attributeLines":{"id":17,"title":18,"vrio":19,"layer":20,"relates-to":21},"startLine":16,"endLine":22,"fenceStart":15},{"kind":"heading","level":2,"text":"Trust of the farming community","line":25},{"kind":"prose","text":"The cooperative is run by farmers. No outside player would get fourteen farms to share their\nharvest plans.","startLine":27,"endLine":28},{"kind":"block","blockType":"asset","attributes":{"id":"as-trust","title":"Trust of the farming community","vrio":"vrio","layer":"aggregator","relates-to":"e-farmers"},"attributeLines":{"id":32,"title":33,"vrio":34,"layer":35,"relates-to":36},"startLine":31,"endLine":37,"fenceStart":30},{"kind":"heading","level":2,"text":"Refrigerated depot","line":40},{"kind":"prose","text":"A shared cold room at the edge of town. Useful, but others could rent one tomorrow.","startLine":42,"endLine":42},{"kind":"ignore","code":"H002","reason":"The depot is a supporting asset by design, not the advantage we build on","line":45},{"kind":"block","blockType":"asset","attributes":{"id":"as-depot","title":"Refrigerated depot","vrio":"vr","layer":"infrastructure","relates-to":"j-drive"},"attributeLines":{"id":48,"title":49,"vrio":50,"layer":51,"relates-to":52},"startLine":47,"endLine":53,"fenceStart":44},{"kind":"heading","level":2,"text":"Regional wholesale market","line":56},{"kind":"prose","text":"The established buyer of last resort. We do not try to replace it: surplus still goes there, but\nno longer by default.","startLine":58,"endLine":59},{"kind":"block","blockType":"moat","attributes":{"id":"mo-wholesale","title":"Regional wholesale market","kind":"demand-aggregator","holder":"e-wholesaler","layer":"aggregator","arena":"ar-selling"},"attributeLines":{"id":63,"title":64,"kind":65,"holder":66,"layer":67,"arena":68},"startLine":62,"endLine":69,"fenceStart":61}]},{"file":"1-exploration/e5-value-chain.pdt42.md","title":"Map the value chain","steps":["E5"],"nodes":[{"kind":"heading","level":1,"text":"Map the value chain","line":1},{"kind":"prose","text":"The value chain of selling the harvest, from the kitchens' needs down to the vans. Today it is\nC-shaped: the wholesaler sits between farms and kitchens, and farms are perceived as a commodity.","startLine":3,"endLine":4},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-value-chain","canvas":"wardley-map","of":"ar-selling"},"attributeLines":{"id":8,"canvas":9,"of":10},"startLine":7,"endLine":11,"fenceStart":6},{"kind":"heading","level":2,"text":"Seasonal menu","line":14},{"kind":"prose","text":"Restaurants need produce that makes a menu worth coming back for.","startLine":16,"endLine":16},{"kind":"block","blockType":"component","attributes":{"id":"c-menu","title":"Seasonal menu","arena":"ar-selling","visibility":"95","evolution":"custom","needs":"c-produce, c-ordering","entity":"e-restaurants"},"attributeLines":{"id":20,"title":21,"arena":22,"visibility":23,"evolution":24,"needs":25,"entity":26},"startLine":19,"endLine":27,"fenceStart":18},{"kind":"heading","level":2,"text":"Fresh food at home","line":30},{"kind":"prose","text":"Households want to cook what is in season without planning their week around a market.","startLine":32,"endLine":32},{"kind":"block","blockType":"component","attributes":{"id":"c-fresh-food","title":"Fresh food at home","arena":"ar-selling","visibility":"90","evolution":"product","needs":"c-produce, c-ordering","entity":"e-households"},"attributeLines":{"id":36,"title":37,"arena":38,"visibility":39,"evolution":40,"needs":41,"entity":42},"startLine":35,"endLine":43,"fenceStart":34},{"kind":"heading","level":2,"text":"Farm produce","line":46},{"kind":"prose","text":"Today bought as anonymous boxes of vegetables. After the plays, each farm's produce is visible and\nchosen for its varieties.","startLine":48,"endLine":49},{"kind":"block","blockType":"component","attributes":{"id":"c-produce","title":"Farm produce","arena":"ar-selling","visibility":"45","evolution":"commodity","target":"custom","needs":"c-delivery","entity":"e-farmers"},"attributeLines":{"id":53,"title":54,"arena":55,"visibility":56,"evolution":57,"target":58,"needs":59,"entity":60},"startLine":52,"endLine":61,"fenceStart":51},{"kind":"heading","level":2,"text":"Ordering and pricing","line":64},{"kind":"prose","text":"Phone calls and haggling today; a standard pre-order after the plays.","startLine":66,"endLine":66},{"kind":"block","blockType":"component","attributes":{"id":"c-ordering","title":"Ordering and pricing","arena":"ar-selling","visibility":"60","evolution":"custom","target":"product","needs":"c-wholesale"},"attributeLines":{"id":70,"title":71,"arena":72,"visibility":73,"evolution":74,"target":75,"needs":76},"startLine":69,"endLine":77,"fenceStart":68},{"kind":"heading","level":2,"text":"Wholesale trading","line":80},{"kind":"prose","text":"The wholesaler's price list, which sets the floor for everyone.","startLine":82,"endLine":82},{"kind":"block","blockType":"component","attributes":{"id":"c-wholesale","title":"Wholesale trading","arena":"ar-selling","visibility":"35","evolution":"product","entity":"e-wholesaler"},"attributeLines":{"id":86,"title":87,"arena":88,"visibility":89,"evolution":90,"entity":91},"startLine":85,"endLine":92,"fenceStart":84},{"kind":"heading","level":2,"text":"Last-mile delivery","line":95},{"kind":"prose","text":"Every farm with its own van today; shared routes after the plays.","startLine":97,"endLine":97},{"kind":"block","blockType":"component","attributes":{"id":"c-delivery","title":"Last-mile delivery","arena":"ar-selling","visibility":"25","evolution":"custom","target":"product","needs":"c-vans"},"attributeLines":{"id":101,"title":102,"arena":103,"visibility":104,"evolution":105,"target":106,"needs":107},"startLine":100,"endLine":108,"fenceStart":99},{"kind":"heading","level":2,"text":"Vans and fuel","line":111},{"kind":"prose","text":"A commodity.","startLine":113,"endLine":113},{"kind":"block","blockType":"component","attributes":{"id":"c-vans","title":"Vans and fuel","arena":"ar-selling","visibility":"10","evolution":"commodity"},"attributeLines":{"id":117,"title":118,"arena":119,"visibility":120,"evolution":121},"startLine":116,"endLine":122,"fenceStart":115}]},{"file":"1-exploration/e6-plays.pdt42.md","title":"Apply the six Platform Plays","steps":["E6"],"nodes":[{"kind":"heading","level":1,"text":"Apply the six Platform Plays","line":1},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-plays","canvas":"platform-plays"},"attributeLines":{"id":5,"canvas":6},"startLine":4,"endLine":7,"fenceStart":3},{"kind":"heading","level":2,"text":"Farms on top of the chain","line":10},{"kind":"prose","text":"Farmers are hidden behind the wholesaler and perceived as a commodity. Bringing them to the top\nof the chain — visible, with their varieties and their story — is the central move.","startLine":12,"endLine":13},{"kind":"block","blockType":"play","attributes":{"id":"pl-producers-up","play":"pp2","arena":"ar-selling","affects":"c-produce","insight":"Treat farmers as users with their own storefront; kitchens choose farms, not boxes"},"attributeLines":{"id":17,"play":18,"arena":19,"affects":20,"insight":21},"startLine":16,"endLine":22,"fenceStart":15},{"kind":"heading","level":2,"text":"A standard pre-order","line":25},{"kind":"prose","text":"Every deal is negotiated by phone. A standard pre-order — variety, kilos, week, price band — lets\nany kitchen commit to any farm in minutes.","startLine":27,"endLine":28},{"kind":"block","blockType":"play","attributes":{"id":"pl-standard-order","play":"pp3","arena":"ar-selling","affects":"c-ordering","insight":"Standardise the pre-order and the weekly availability list; that is the transaction to build"},"attributeLines":{"id":32,"play":33,"arena":34,"affects":35,"insight":36},"startLine":31,"endLine":37,"fenceStart":30},{"kind":"heading","level":2,"text":"Aggregate the kitchens' demand","line":40},{"kind":"prose","text":"Individually, restaurants and households are too small to plan for. Aggregated per week and per\nvariety, they become a demand farms can sow against.","startLine":42,"endLine":43},{"kind":"block","blockType":"play","attributes":{"id":"pl-aggregate","play":"pp6","arena":"ar-selling","affects":"c-wholesale, c-delivery","insight":"Pool orders per week and route; the wholesaler becomes the outlet for surplus only"},"attributeLines":{"id":47,"play":48,"arena":49,"affects":50,"insight":51},"startLine":46,"endLine":52,"fenceStart":45}]},{"file":"1-exploration/e7-brief.pdt42.md","title":"Identify the platformization space and consolidate the brief","steps":["E7"],"nodes":[{"kind":"heading","level":1,"text":"Identify the platformization space and consolidate the brief","line":1},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-brief","canvas":"brief-consolidation"},"attributeLines":{"id":5,"canvas":6},"startLine":4,"endLine":7,"fenceStart":3},{"kind":"heading","level":2,"text":"Hub hosts become a profession","line":10},{"kind":"prose","text":"If pick-up points in cafés and bakeries spread, hosting a hub could become a small income for\nengaged households — a new role in the ecosystem.","startLine":12,"endLine":13},{"kind":"block","blockType":"scenario","attributes":{"id":"sc-hub-hosts","title":"Hub hosts become a profession","pattern":"e4","arena":"ar-selling","impact":"Households evolve into hosts; delivery cost per box drops as hubs multiply"},"attributeLines":{"id":17,"title":18,"pattern":19,"arena":20,"impact":21},"startLine":16,"endLine":22,"fenceStart":15},{"kind":"heading","level":2,"text":"Planned harvests for local kitchens","line":25},{"kind":"prose","text":"The platformization space is the selling arena, around two core relationships: farms with\nrestaurants (planned, high volume) and farms with households (weekly boxes). Couriers are an\nancillary but necessary role.","startLine":27,"endLine":29},{"kind":"block","blockType":"brief","attributes":{"id":"br-main","title":"Planned harvests for local kitchens","arena":"ar-selling","entities":"e-farmers, e-restaurants, e-households, e-couriers","standardize":["Weekly availability list","Seasonal pre-order","Shared delivery booking"],"product-side":["Farm storefront and harvest forecast","Invoicing and payouts"],"moats":"mo-wholesale"},"attributeLines":{"id":33,"title":34,"arena":35,"entities":36,"standardize":37,"product-side":41,"moats":44},"startLine":32,"endLine":45,"fenceStart":31}]},{"file":"2-design/d1-ecosystem.pdt42.md","title":"Map the ecosystem · Portray the entity-roles","steps":["D1","D2"],"nodes":[{"kind":"heading","level":1,"text":"Map the ecosystem · Portray the entity-roles","line":1},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-ecosystem","canvas":"ecosystem"},"attributeLines":{"id":5,"canvas":6},"startLine":4,"endLine":7,"fenceStart":3},{"kind":"heading","level":2,"text":"Harvest Commons","line":10},{"kind":"prose","text":"Harvest Commons turns guesses into commitments: kitchens commit to what they will cook, farms sow\nagainst it, and the cooperative bundles delivery so no farm drives alone. Its promise to every\nmember is simple — selling gets easier, and you learn faster inside than outside.","startLine":12,"endLine":14},{"kind":"block","blockType":"platform","attributes":{"id":"platform-harvest","title":"Harvest Commons","ecosystem":"eco-food","brief":"br-main","narrative":"Food from the farms around the city becomes the easy default for every kitchen","owners":"e-coop","core-entity":"e-farmers","core-value":"A harvest sold before it is sown","ancillary-values":["Fresh, traceable food without a market trip","Delivery without driving into town"],"infrastructure":["Harvest app","Refrigerated depot","Neighbourhood pick-up hubs"]},"attributeLines":{"id":18,"title":19,"ecosystem":20,"brief":21,"narrative":22,"owners":23,"core-entity":24,"core-value":25,"ancillary-values":26,"infrastructure":29},"startLine":17,"endLine":33,"fenceStart":16},{"kind":"heading","level":2,"text":"Harvest Commons Cooperative","line":36},{"kind":"prose","text":"The cooperative runs the platform on behalf of its member farms: two staff, a monthly members'\nassembly, and a thin commission to live on.","startLine":38,"endLine":39},{"kind":"block","blockType":"entity","attributes":{"id":"e-coop","title":"Harvest Commons Cooperative","role":"owner","type":"cooperative owned by its farms"},"attributeLines":{"id":43,"title":44,"role":45,"type":46},"startLine":42,"endLine":47,"fenceStart":41},{"kind":"heading","level":2,"text":"Small-scale farmers","line":50},{"kind":"prose","text":"Family farms of two to twenty hectares within sixty kilometres. They grow well; selling is what\ncosts them — time on the phone, trips into town, and the fifth of the harvest nobody buys.","startLine":52,"endLine":53},{"kind":"block","blockType":"entity","attributes":{"id":"e-farmers","title":"Small-scale farmers","role":"peer-producer","layer":"long-tail","type":"family businesses","clusters":["Vegetable growers","Orchards","Herb growers"],"assets":["Land within an hour of the city","Heirloom varieties"],"capabilities":["Deep knowledge of soil and seasons"],"potential":["Could grow to order for named kitchens"],"goals":["A predictable income before the season starts"],"pressures":["Volatile demand, up to 20 % unsold","Rising fuel and labour costs"],"convenience-gains":["Selling as simple as loading a crate"],"reach-gains":["Kitchens that value their varieties"],"value-gains":["Fair prices, paid on time","Recognition for their craft"]},"attributeLines":{"id":57,"title":58,"role":59,"layer":60,"type":61,"clusters":62,"assets":66,"capabilities":69,"potential":71,"goals":73,"pressures":75,"convenience-gains":78,"reach-gains":80,"value-gains":82},"startLine":56,"endLine":85,"fenceStart":55},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-portrait-farmers","canvas":"entity-portrait","of":"e-farmers"},"attributeLines":{"id":90,"canvas":91,"of":92},"startLine":89,"endLine":93,"fenceStart":88},{"kind":"heading","level":2,"text":"Food artisans","line":96},{"kind":"prose","text":"Bakers, cheesemakers and preservers who add variety to every order and buy surplus that would\notherwise spoil.","startLine":98,"endLine":99},{"kind":"block","blockType":"entity","attributes":{"id":"e-artisans","title":"Food artisans","role":"peer-producer","layer":"long-tail","type":"micro-businesses","clusters":["Micro-bakeries","Small dairies","Preserve makers"],"capabilities":["Turning surplus into products that keep"],"goals":["Steady sales beyond their own shop"],"convenience-gains":["A shelf in every order without a shop of their own"],"value-gains":["Surplus produce at fair prices"]},"attributeLines":{"id":103,"title":104,"role":105,"layer":106,"type":107,"clusters":108,"capabilities":112,"goals":114,"convenience-gains":116,"value-gains":118},"startLine":102,"endLine":120,"fenceStart":101},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-portrait-artisans","canvas":"entity-portrait","of":"e-artisans"},"attributeLines":{"id":125,"canvas":126,"of":127},"startLine":124,"endLine":128,"fenceStart":123},{"kind":"heading","level":2,"text":"Independent restaurants","line":131},{"kind":"prose","text":"Chef-owned restaurants that write their menu around the season and can commit to volumes months\nahead — if the supply is reliable.","startLine":133,"endLine":134},{"kind":"block","blockType":"entity","attributes":{"id":"e-restaurants","title":"Independent restaurants","role":"peer-consumer","layer":"long-tail","type":"chef-owned SMBs, 30–80 covers","clusters":["Bistros","Fine dining","Canteens run by chefs"],"assets":["Bulk demand planned months ahead"],"potential":["Could co-plan crops with farms"],"goals":["Signature dishes built on local produce"],"pressures":["Wholesalers offer little local produce","Menus depend on unreliable supply"],"convenience-gains":["One order for many farms"],"reach-gains":["A direct line to the grower"],"value-gains":["A story guests remember"]},"attributeLines":{"id":138,"title":139,"role":140,"layer":141,"type":142,"clusters":143,"assets":147,"potential":149,"goals":151,"pressures":153,"convenience-gains":156,"reach-gains":158,"value-gains":160},"startLine":137,"endLine":162,"fenceStart":136},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-portrait-restaurants","canvas":"entity-portrait","of":"e-restaurants"},"attributeLines":{"id":167,"canvas":168,"of":169},"startLine":166,"endLine":170,"fenceStart":165},{"kind":"heading","level":2,"text":"Neighbourhood households","line":173},{"kind":"prose","text":"Families and flat shares who care where food comes from but shop at the supermarket because it is\nconvenient.","startLine":175,"endLine":176},{"kind":"block","blockType":"entity","attributes":{"id":"e-households","title":"Neighbourhood households","role":"peer-consumer","layer":"long-tail","type":"individuals","clusters":["Families","Flat shares"],"potential":["Could commit to a season and bring their neighbours"],"goals":["Cook fresh food three to five times a week"],"pressures":["Little time for shopping","Food prices rising faster than income"],"convenience-gains":["Pick-up as easy as the corner shop"],"reach-gains":["Farms they can visit"],"value-gains":["Fair price without a market trip"]},"attributeLines":{"id":180,"title":181,"role":182,"layer":183,"type":184,"clusters":185,"potential":188,"goals":190,"pressures":192,"convenience-gains":195,"reach-gains":197,"value :25,"test":26,"criteria":27,"status":28},"startLine":20,"endLine":29,"fenceStart":8},{"kind":"block","blockType":"assumption","attributes":{"id":"a-hub-trust","title":"Households trust a café shelf with their food","mvp":"mvp-box-pilot","kind":"trust","test":"Track boxes left uncollected","criteria":"Fewer than 5 % uncollected per week","status":"validated"},"attributeLines":{"id":32,"title":33,"mvp":34,"kind":35,"test":36,"criteria":37,"status":38},"startLine":31,"endLine":39,"fenceStart":8},{"kind":"block","blockType":"assumption","attributes":{"id":"a-margin","title":"An 8 % commission covers hubs and routes","mvp":"mvp-box-pilot","kind":"business-model","riskiest":"yes","test":"Book every cost of the pilot per box","criteria":"Contribution margin positive by week 8","status":"open"},"attributeLines":{"id":42,"title":43,"mvp":44,"kind":45,"riskiest":46,"test":47,"criteria":48,"status":49},"startLine":41,"endLine":50,"fenceStart":8},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-mvp-box","canvas":"mvp","of":"mvp-box-pilot"},"attributeLines":{"id":55,"canvas":56,"of":57},"startLine":54,"endLine":58,"fenceStart":53},{"kind":"heading","level":2,"text":"Winter planning circle","line":61},{"kind":"prose","text":"One round of crop planning with three chefs and three farms before the next season.","startLine":63,"endLine":63},{"kind":"block","blockType":"mvp","attributes":{"id":"mvp-chefs-circle","title":"Winter planning circle","experiences":"x-chefs-table","base":["Three chefs who already buy at the market"],"implementation":"Wizard of Oz — pre-orders on paper, confirmed by phone","status":"planned"},"attributeLines":{"id":67,"title":68,"experiences":69,"base":70,"implementation":72,"status":73},"startLine":66,"endLine":74,"fenceStart":65},{"kind":"block","blockType":"assumption","attributes":{"id":"a-commit","title":"Chefs commit to volumes five months ahead","mvp":"mvp-chefs-circle","kind":"attraction","riskiest":"yes","test":"Two planning evenings in th \nphone — come for the tool, stay for the kitchens.","startLine":15,"endLine":16},{"kind":"block","blockType":"value-proposition","attributes":{"id":"vp-farm-backoffice","title":"Farm back-office","kind":"product","customer":"e-farmers","bundle":["Storefront and weekly availability list","Harvest forecast from pre-orders","Invoicing and payouts","Route booking"]},"attributeLines":{"id":20,"title":21,"kind":22,"customer":23,"bundle":24},"startLine":19,"endLine":29,"fenceStart":18},{"kind":"heading","level":2,"text":"Kitchen marketplace","line":32},{"kind":"prose","text":"Restaurants meet farms and pre-order the season.","startLine":34,"endLine":34},{"kind":"block","blockType":"value-proposition","attributes":{"id":"vp-kitchen-market","title":"Kitchen marketplace","kind":"marketplace","relationship":"r-farmer-restaurant"},"attributeLines":{"id":38,"title":39,"kind":40,"relationship":41},"startLine":37,"endLine":42,"fenceStart":36},{"kind":"heading","level":2,"text":"Box marketplace","line":45},{"kind":"prose","text":"Households subscribe to boxes composed from many farms.","startLine":47,"endLine":47},{"kind":"block","blockType":"value-proposition","attributes":{"id":"vp-box-market","title":"Box marketplace","kind":"marketplace","relationship":"r-farmer-household"},"attributeLines":{"id":51,"title":52,"kind":53,"relationship":54},"startLine":50,"endLine":55,"fenceStart":49}]},{"file":"3-growth/g2-network.pdt42.md","title":"Characterise the network","steps":["G2"],"nodes":[{"kind":"heading","level":1,"text":"Characterise the network","line":1},{"kind":"heading","level":2,"text":"Farm ↔ restaurant network","line":3},{"kind":"prose","text":"Differentiated, regional, high-frequency and fairly monogamous: chefs stay with farms they trust.\nLiquidity comes slowly, but the network effect should not plateau early — variety keeps adding\nvalue. Tactics: a strong single-user tool for farms and a marquee chef to pull the others.","startLine":5,"endLine":7},{"kind":"block","block "level":1,"text":"Sketch the flywheels","line":1},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-flywheels","canvas":"flywheel-sketching"},"attributeLines":{"id":5,"canvas":6},"startLine":4,"endLine":7,"fenceStart":3},{"kind":"heading","level":2,"text":"More farms, better boxes","line":10},{"kind":"prose","text":"The core indirect network effect: more farms make boxes more varied, more varied boxes keep more\nhouseholds, more subscriptions attract more farms.","startLine":12,"endLine":13},{"kind":"block","blockType":"flywheel","attributes":{"id":"fw-core","title":"More farms, better boxes","type":"indirect-network","relationship":"r-farmer-household","loop":["More farms","More variety per box","More households subscribe","Predictable demand attracts farms"],"bottleneck":"Farms joining — supply is constrained","metric":"Active farms per neighbourhood"},"attributeLines":{"id":17,"title":18,"type":19,"relationship":20,"loop":21,"bottleneck":26,"metric":27},"startLine":16,"endLine":28,"fenceStart":15},{"kind":"heading","level":2,"text":"Planning data","line":31},{"kind":"prose","text":"Every season of pre-orders makes the harvest forecast better, which makes pre-ordering safer.","startLine":33,"endLine":33},{"kind":"block","blockType":"flywheel","attributes":{"id":"fw-data","title":"Planning data","type":"data","reinforces":"fw-core","loop":["More pre-orders","Better forecasts","Less waste, better prices","More pre-orders"],"bottleneck":"Seasons are long — one turn per year","metric":"Forecast error per variety"},"attributeLines":{"id":37,"title":38,"type":39,"reinforces":40,"loop":41,"bottleneck":46,"metric":47},"startLine":36,"endLine":48,"fenceStart":35},{"kind":"heading","level":2,"text":"Back-office lock-in","line":51},{"kind":"prose","text":"Farms that run invoicing and planning in the back-office rarely leave.","startLine":53,"endLine":53},{"kind":"block","blockType":"flywheel","attributes":{"id":"fw-lockin","title":"Back-office lock-in","type":"lock-in","reinforces":"fw-core","relationship":"r-farmer-restaurant","loop":["Farms run their business in the back-office","Switching costs grow","Farms stay and invest in the platform"],"bottleneck":"The back-office must be good enough on its own","metric":"Share of farm revenue invoiced through the platform"},"attributeLines":{"id":57,"title":58,"type":59,"reinforces":60,"relationship":61,"loop":62,"bottleneck":66,"metric":67},"startLine":56,"endLine":68,"fenceStart":55}]},{"file":"3-growth/g4-liquidity.pdt42.md","title":"Plan liquidity","steps":["G4"],"nodes":[{"kind":"heading","level":1,"text":"Plan liquidity","line":1},{"kind":"heading","level":2,"text":"Kitchens in the city centre","line":3},{"kind":"prose","text":"Start with supply: farms are scarce, chefs are many. One category, one district.","startLine":5,"endLine":5},{"kind":"block","blockType":"liquidity","attributes":{"id":"lq-kitchen","relationship":"r-farmer-restaurant","canonical-unit":"Chef-owned restaurants in the city centre × vegetables","alternatives":["Wholesale market","Calling farms directly"],"supply-threshold":"A farm needs pre-orders from four kitchens to plan against them","demand-threshold":"A chef needs at least eight farms to cover a menu","start-with":"supply","constraints":["City centre only","Vegetables before fruit and dairy"]},"attributeLines":{"id":9,"relationship":10,"canonical-unit":11,"alternatives":12,"supply-threshold":15,"demand-threshold":16,"start-with":17,"constraints":18},"startLine":8,"endLine":21,"fenceStart":7},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-liquidity-kitchen","canvas":"liquidity","of":"r-farmer-restaurant"},"attributeLines":{"id":26,"canvas":27,"of":28},"startLine":25,"endLine":29,"fenceStart":24},{"kind":"heading","level":2,"text":"Boxes in one neighbourhood","line":32},{"kind":"prose","text":"The cooperative's market customers make demand easy to find; farms willing to pack boxes are the constraint.","startLine":34,"endLine":34},{"kind":"block","blockType":"liquidity","attributes":{"id":"lq-box","relationship":"r-farmer-household","canonical-unit":"One neighbourhood × weekly vegetable box","alternatives":["Supermarket","Saturday market"],"supply-threshold":"Forty boxes a week make the route worth it for a farm","demand-threshold":"Five farms make a box varied enough to keep","start-with":"supply","constraints":["One neighbourhood, three hubs"]},"attributeLines":{"id":38,"relationship":39,"canonical-unit":40,"alternatives":41,"supply-threshold":44,"demand-threshold":45,"start-with":46,"constraints":47},"startLine":37,"endLine":49,"fenceStart":36},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-liquidity-box","canvas":"liquidity","of":"r-farmer-household"},"attributeLines":{"id":54,"canvas":55,"of":56},"startLine":53,"endLine":57,"fenceStart":52}]},{"file":"3-growth/g5-growth-loops.pdt42.md","title":"Build the growth engine","steps":["G5"],"nodes":[{"kind":"heading","level":1,"text":"Build the growth engine","line":1},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-growth","canvas":"growth-model"},"attributeLines":{"id":5,"canvas":6},"startLine":4,"endLine":7,"fenceStart":3},{"kind":"heading","level":2,"text":"Recipes bring neighbours","line":10},{"kind":"prose","text":"Households share how they cooked their box; every shared recipe links to the neighbourhood's hub.","startLine":12,"endLine":12},{"kind":"block","blockType":"growth-loop","attributes":{"id":"gl-recipes","title":"Recipes bring neighbours","type":"ugc","acquires":"e-households","feeds":"fw-core","equation":"new households = recipes shared × views per recipe × sign-up rate","bottleneck":"Share of households who publish recipes","cycle-time":"One week","metric":"Recipes shared per 100 boxes"},"attributeLines":{"id":16,"title":17,"type":18,"acquires":19,"feeds":20,"equation":21,"bottleneck":22,"cycle-time":23,"metric":24},"startLine":15,"endLine":25,"fenceStart":14},{"kind":"heading","level":2,"text":"Chefs recommend farms to chefs","line":28},{"kind":"prose","text":"A chef who credits a farm on the menu is asked by peers where the produce comes from.","startLine":30,"endLine":30},{"kind":"block","blockType":"growth-loop","attributes":{"id":"gl-chef-referrals","title":"Chefs recommend farms to chefs","type":"viral","acquires":"e-restaurants","feeds":"fw-lockin","equation":"new kitchens = active kitchens × referrals per season × conversion","bottleneck":"Referrals per season","cycle-time":"One season","metric":"Referred kitchens per season"},"attributeLines":{"id":34,"title":35,"type":36,"acquires":37,"feeds":38,"equation":39,"bottleneck":40,"cycle-time":41,"metric":42},"startLine":33,"endLine":43,"fenceStart":32}]}],"elements":[{"kind":"ecosystem","id":"eco-food","title":"Regional food system","data":{"id":"eco-food","title":"Regional food system","context":"ecosystem-mobilization"},"prose":"Around the city, about sixty small farms grow vegetables, fruit and herbs. They sell at weekly\nmarkets, to a regional wholesale market and to a handful of restaurants that call them directly.\nValue is exchanged every day — but through phone calls, market stalls and a wholesaler that\nhides the farms from the kitchens that cook their produce.","file":"1-exploration/e1-arenas.pdt42.md","line":18},{"kind":"arena","id":"ar-growing","title":"Growing and harvesting","data":{"id":"ar-growing","title":"Growing and harvesting","outcome":"The right crops are ready at the right time","after":[],"enables":[],"steps":["Plan the crops","Grow","Harvest"]},"prose":"Planning crops, growing them and bringing them in. Seasonal and weather-bound; today planned\nagainst last year's sales rather than against demand.","file":"1-exploration/e1-arenas.pdt42.md","line":31},{"kind":"arena","id":"ar-selling","title":"Selling the harvest","data":{"id":"ar-selling","title":"Selling the harvest","outcome":"Produce reaches a kitchen at a fair price before it spoils","after":["ar-growing"],"enables":[],"focus":true,"steps":["Find buyers","Agree quantities and prices","Deliver","Get paid and get feedback"]},"prose":"Finding buyers, agreeing quantities and prices, and getting paid. This is where farms lose most\nvalue: up to a fifth of the harvest is never sold. It is our focus — the cooperative already runs\na market stall and knows both farms and customers, and the only incumbent here is the wholesale\nmarket.","file":"1-exploration/e1-arenas.pdt42.md","line":50},{"kind":"arena","id":"ar-delivery","title":"Getting food to kitchens","data":{"id":"ar-delivery","title":"Getting food to kitchens","outcome":"Food arrives fresh, on time and without every farm driving into town","after":[],"enables":["ar-selling"],"steps":[]},"prose":"Transport from the farm into the city. Every farm drives its own van today; this arena enables\nselling.","file":"1-exploration/e1-arenas.pdt42.md","line":70},{"kind":"arena","id":"ar-cooking","title":"Cooking and eating","data":{"id":"ar-cooking","title":"Cooking and eating","outcome":"Seasonal meals that tell where the food comes from","after":["ar-selling"],"enables":[],"steps":[]},"prose":"What restaurants and households do with the food. Enabled by selling; out of our reach for now.","file":"1-exploration/e1-arenas.pdt42.md","line":83},{"kind":"job","id":"j-find-buyers","title":"Find buyers for the week's harvest","data":{"id":"j-find-buyers","title":"Find buyers for the week's harvest","arena":"ar-selling","entities":["e-farmers","e-restaurants","e-wholesaler"],"job-step":"locate"},"prose":"Every Monday farmers call restaurants and the wholesaler to place what they expect to harvest.\nWhatever is left goes to the wholesaler at its price.","file":"1-exploration/e2-scan.pdt42.md","line":16},{"kind":"job","id":"j-market","title":"Sell at the Saturday market","data":{"id":"j-market","title":"Sell at the Saturday market","arena":"ar-selling","entities":["e-farmers","e-households"],"job-step":"execute"},"prose":"Farmers and households meet in person. Households love it but cannot plan around it.","file":"1-exploration/e2-scan.pdt42.md","line":30},{"kind":"job","id":"j-drive","title":"Drive produce into town","data":{"id":"j-drive","title":"Drive produce into town","arena":"ar-delivery","entities":["e-farmers","e-restaurants"],"job-step":"execute"},"prose":"Each farm loads its own van for a handful of deliveries.","file":"1-exploration/e2-scan.pdt42.md","line":44},{"kind":"asset","id":"as-customers","title":"Saturday market customer base","data":{"id":"as-customers","title":"Saturday market customer base","vrio":"vrio","layer":"long-tail","relates-to":["e-households","j-market"]},"prose":"Eight years of market days have built a list of 2,000 households who ask for the farms by name.\nValuable, rare, hard to copy — and the cooperative is organised to use it.","file":"1-exploration/e3-assets-moats.pdt42.md","line":16},{"kind":"asset","id":"as-trust","title":"Trust of the farming community","data":{"id":"as-trust","title":"Trust of the farming community","vrio":"vrio","layer":"aggregator","relates-to":["e-farmers"]},"prose":"The cooperative is run by farmers. No outside player would get fourteen farms to share their\nharvest plans.","file":"1-exploration/e3-assets-moats.pdt42.md","line":31},{"kind":"asset","id":"as-depot","title":"Refrigerated depot","data":{"id":"as-depot","title":"Refrigerated depot","vrio":"vr","layer":"infrastructure","relates-to":["j-drive"]},"prose":"A shared cold room at the edge of town. Useful, but others could rent one tomorrow.","file":"1-exploration/e3-assets-moats.pdt42.md","line":47},{"kind":"moat","id":"mo-wholesale","title":"Regional wholesale market","data":{"id":"mo-wholesale","title":"Regional wholesale market","kind":"demand-aggregator","holder":"e-wholesaler","layer":"aggregator","arena":"ar-selling"},"prose":"The established buyer of last resort. We do not try to replace it: surplus still goes there, but\nno longer by default.","file":"1-exploration/e3-assets-moats.pdt42.md","line":62},
