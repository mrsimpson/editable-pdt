name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The site is served from the gh-pages branch (Settings → Pages → Deploy from a branch →
# gh-pages, / (root)). main lives at the root; pr-preview.yml puts each pull request's preview
# under pr-preview/pr-<number>/, which this deployment leaves alone.
permissions:
  contents: write

# Only one deployment at a time; new pushes cancel pending runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      # The landing page (screenshots from demo/, committed) and the example beside it, in site/.
      # Both use relative URLs, so they work at the root and under any preview path.
      - name: Assemble site
        run: pnpm run site:assemble

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean-exclude: pr-preview/
          force: false
